name: Navigation GPS tests
on:
  push:
    branches: [main, feat/vars-les-claux-gps-tracking]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
      - run: node --test navigation/vars-les-claux/*.test.mjs
      - run: node navigation/vars-les-claux/gps-qualification.mjs
